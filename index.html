<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For You — I Love You</title>
  <link rel="stylesheet" href="styles.css">
</head>
  <body>
    <div class="bg-animation">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="waves">
      <div class="wave"></div>
      <div class="wave wave2"></div>
      <div class="wave wave3"></div>
    </div>
    <div class="gradient-overlay"></div>
    <div class="container">
      <div class="hearts" aria-hidden="true"></div>
      <div class="message">
        <h1>My Love ❤️</h1>
        <p class="typewriter">Every moment without you feels like forever...</p>
        <p>I miss you more than words can say! 💕</p>
        <div class="buttons">
          <button class="btn btn-primary" id="surpriseBtn">Send Love</button>
          <button class="btn" id="messageBtn">Read Note</button>
        </div>
        <div class="footer">Made with ❤️</div>
      </div>
    </div>
    <div class="modal hidden">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <p id="love-note"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
